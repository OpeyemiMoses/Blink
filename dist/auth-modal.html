<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blink | Privy Secure Authentication</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0B0E14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(91, 103, 246, 0.2);
      border-top-color: #5B67F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    .sub {
      font-size: 14px;
      color: #94A3B8;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">Connecting to Privy...</div>
  <div class="sub">Launching secure decentralized authentication bridge for Solana.</div>

  <script>
    // Forward query params to main app with auth_modal=1 flag
    const searchParams = new URLSearchParams(window.location.search);
    searchParams.set('auth_modal', '1');
    const targetUrl = '/?' + searchParams.toString();
    window.location.replace(targetUrl);
  </script>
</body>
</html>
