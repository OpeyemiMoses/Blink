<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Blink | Physical Solana Actions & Merchant POS</title>
    
    <!-- Poppins + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      *, *::before, *::after {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background-color: #07080B;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      code, kbd, samp, pre, .mono, [style*="monospace"], [style*="Courier"], [style*="Menlo"] {
        font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace !important;
      }
      input, textarea, select {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 11px !important;
        line-height: normal !important;
      }
      input::placeholder, textarea::placeholder {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 10px !important;
        opacity: 0.6 !important;
        color: #94A3B8 !important;
      }
    <script>
      (function() {
        // Immediate storage safeguard in head before any bundle evaluates
        try {
          if (!window.localStorage) throw new Error();
          var k = '__b_t__';
          window.localStorage.setItem(k, '1');
          window.localStorage.removeItem(k);
        } catch(e) {
          var mem = {};
          window.localStorage = {
            getItem: function(k) { return mem[k] || null; },
            setItem: function(k, v) { mem[k] = String(v); },
            removeItem: function(k) { delete mem[k]; },
            clear: function() { mem = {}; },
            get length() { return Object.keys(mem).length; },
            key: function(i) { return Object.keys(mem)[i] || null; }
          };
        }
        try {
          if (!window.sessionStorage) throw new Error();
          var sk = '__b_st__';
          window.sessionStorage.setItem(sk, '1');
          window.sessionStorage.removeItem(sk);
        } catch(e) {
          var smem = {};
          window.sessionStorage = {
            getItem: function(k) { return smem[k] || null; },
            setItem: function(k, v) { smem[k] = String(v); },
            removeItem: function(k) { delete smem[k]; },
            clear: function() { smem = {}; },
            get length() { return Object.keys(smem).length; },
            key: function(i) { return Object.keys(smem)[i] || null; }
          };
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico"/>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Blink.</noscript>
    <div id="root"></div>
    <script>
      // Blank screen fallback recovery
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.warn('[Blink Boot Guard] Root is still empty after 5 seconds. Rendering recovery screen.');
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#07080B;color:#FFF;padding:24px;font-family:sans-serif;text-align:center;">' +
            '<h2 style="font-size:22px;font-weight:800;margin-bottom:12px;">Welcome to Blink</h2>' +
            '<p style="color:#94A3B8;font-size:14px;max-width:320px;margin-bottom:24px;">Initializing application resources. If this takes longer than usual, tap below to reload.</p>' +
            '<button onclick="window.location.reload()" style="background:#5B67F6;color:#FFF;border:none;padding:12px 28px;border-radius:24px;font-weight:700;font-size:14px;cursor:pointer;">Reload App</button>' +
          '</div>';
        }
      }, 5000);
    </script>
  </body>
</html>
