<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Blink | Physical Solana Actions & Merchant POS</title>
    
    <!-- Poppins + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      *, *::before, *::after {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background-color: #07080B;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      code, kbd, samp, pre, .mono, [style*="monospace"], [style*="Courier"], [style*="Menlo"] {
        font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace !important;
      }
      input, textarea, select {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 11px !important;
        line-height: normal !important;
      }
      input::placeholder, textarea::placeholder {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 10px !important;
        opacity: 0.6 !important;
        color: #94A3B8 !important;
      }
    </style>
    <link rel="icon" href="/favicon.ico"/>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Blink.</noscript>
    <div id="root"></div>
  </body>
</html>
